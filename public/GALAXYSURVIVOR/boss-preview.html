<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보스 추락 미리보기</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;background:#08111d;color:#edf8fa;font-family:system-ui,sans-serif}.preview{width:min(100%,440px);padding:16px}h1{font-size:20px;margin:0 0 6px}p{font-size:13px;line-height:1.5;color:#bdd1dc}canvas{display:block;width:100%;max-height:75vh;object-fit:contain;background:#0a142c;image-rendering:pixelated;border:2px solid #526c80}button{width:100%;min-height:48px;margin-top:12px;border:2px solid #28191b;border-radius:8px;color:#fff4df;font-size:15px;font-weight:800;background:#a94b39;box-shadow:inset 0 2px #f7b490,0 3px #471e23}button:focus-visible{outline:3px solid #ffda99;outline-offset:3px}</style></head><body><main class="preview"><h1>보스 격파 연출 미리보기</h1><p>보스가 폭발하며 추락하는 장면입니다. 실제 게임 진행이나 기록에는 영향을 주지 않습니다.</p><canvas width="400" height="700" aria-label="보스가 폭발하며 추락하는 장면"></canvas><button type="button">다시 보기</button></main><script src="boss-explosion.js?v=3"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),boss=new Image(),background=new Image(),ship=new Image();boss.src='assets/combat-boss-v2.png';background.src='assets/station-background.png';ship.src='assets/combat-player-v3.png';let start=null,frame=0;
function draw(ts){if(start===null)start=ts;const elapsed=Math.min(1.6,(ts-start)/1000),t=elapsed/1.6;ctx.clearRect(0,0,400,700);ctx.imageSmoothingEnabled=false;if(background.complete&&background.naturalWidth)ctx.drawImage(background,0,0,400,700);else{ctx.fillStyle='#0a142c';ctx.fillRect(0,0,400,700)}if(ship.complete&&ship.naturalWidth)ctx.drawImage(ship,176,532,48,56);ctx.save();ctx.translate(200,125+t*t*150);ctx.rotate(t*.34);ctx.globalAlpha=1-t*.7;const w=160*(1-t*.18),h=100*(1-t*.18);ctx.save();ctx.beginPath();ctx.rect(-w/2+w*.23,-h/2,w*.54,h);ctx.clip();if(boss.complete&&boss.naturalWidth)ctx.drawImage(boss,-w/2,-h/2,w,h);ctx.restore();window.BossExplosion.drawFragments(ctx,boss,elapsed);window.BossExplosion.draw(ctx,elapsed);ctx.restore();if(elapsed<1.6)frame=requestAnimationFrame(draw)}
function play(){cancelAnimationFrame(frame);start=null;frame=requestAnimationFrame(draw)}document.querySelector('button').addEventListener('click',play);Promise.all([...([boss,background,ship].map(img=>img.decode().catch(()=>{}))),window.BossExplosion.ready()]).then(play);
</script></body></html>
